<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流程记忆</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--openai-background-primary, #f7f7f4);
      --panel: var(--openai-background-secondary, rgba(255,255,255,.9));
      --text: var(--openai-text-primary, #22211f);
      --muted: var(--openai-text-secondary, #77746d);
      --line: var(--openai-border-subtle, rgba(32,32,31,.12));
      --purple: #7254e6; --purple-soft: rgba(114,84,230,.11);
      --green: #1f9d68; --orange: #e88932; --red: #d94b55; --grey: #aaa69d;
      --shadow: 0 12px 28px rgba(35,30,20,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#191918; --panel:#252523; --text:#f2f0eb; --muted:#aaa69f; --line:rgba(255,255,255,.11); --purple-soft:rgba(150,124,255,.16); --shadow:0 12px 28px rgba(0,0,0,.24); }
    }
    * { box-sizing:border-box; }
    body { margin:0; min-width:280px; color:var(--text); background:radial-gradient(circle at 90% 0,var(--purple-soft),transparent 30%),var(--bg); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif; }
    button,select { font:inherit; color:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; padding:17px 15px 23px; }
    .topbar { display:flex; align-items:center; gap:10px; }
    .brand { width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#8d75f4,#5c3bd0);box-shadow:0 8px 19px rgba(114,84,230,.25); }
    .brand svg { width:19px;height:19px; }
    .title-wrap { flex:1;min-width:0; }
    h1 { margin:0;font-size:16px; }
    .subtitle { color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .icon-button { width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:18px; }
    .conversation-picker { display:none;align-items:center;gap:8px;margin:13px 0 -5px;padding:8px 10px;border:1px dashed rgba(114,84,230,.38);border-radius:11px;color:var(--muted);background:var(--purple-soft);font-size:11px; }
    .conversation-picker.show { display:flex; }
    .conversation-picker select { min-width:0;flex:1;padding:5px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel); }
    .overview { margin-top:15px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow); }
    .overview-top { display:flex;align-items:center;justify-content:space-between;gap:12px; }
    .eyebrow { color:var(--muted);font-size:11px; }
    .progress-value { font-size:23px;font-weight:760;letter-spacing:-.03em; }
    .progress-value small { color:var(--muted);font-size:11px;font-weight:500;letter-spacing:0; }
    .recording { display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;cursor:pointer; }
    .switch { position:relative;width:34px;height:20px;border-radius:20px;background:var(--grey);transition:.2s; }
    .switch::after { content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s; }
    .recording.on .switch { background:var(--green); }
    .recording.on .switch::after { transform:translateX(14px); }
    .bar { height:6px;margin-top:10px;border-radius:8px;overflow:hidden;background:rgba(128,128,128,.16); }
    .bar i { display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--purple),#a487ff);transition:width .3s; }
    .counts { display:flex;gap:12px;margin-top:9px;color:var(--muted);font-size:11px; }
    .counts b { color:var(--text); }
    .section-title { display:flex;align-items:center;justify-content:space-between;gap:9px;margin:18px 2px 8px; }
    .section-title strong { font-size:13px; }
    .section-label { display:grid;gap:1px; }
    .drag-tip { color:var(--muted);font-size:9px; }
    .section-actions { display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:5px;white-space:nowrap; }
    .text-button { padding:2px 1px;border:0;background:transparent;color:var(--purple);font-size:11px;white-space:nowrap; }
    .view-toggle { display:flex;gap:3px;padding:3px;border-radius:9px;background:rgba(128,128,128,.09); }
    .view-toggle button { padding:4px 6px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:10px; }
    .view-toggle button.active { color:var(--text);background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .flow { display:grid;gap:0; }
    .drag-root-zone { position:fixed;z-index:9998;top:62px;left:15px;right:15px;display:none;padding:10px;border:1px dashed rgba(114,84,230,.55);border-radius:12px;text-align:center;color:var(--purple);background:var(--panel);box-shadow:var(--shadow);font-size:11px; }
    .major-gap,.new-group-zone { position:relative;height:9px;min-height:9px;margin:0;padding:0;border:0;background:transparent; }
    .major-gap::after,.new-group-zone::after { content:attr(data-drop-label);position:absolute;z-index:8;left:0;right:0;top:50%;height:36px;display:grid;place-items:center;border:1px dashed var(--purple);border-radius:10px;color:#fff;background:linear-gradient(145deg,#795de8,#6241d5);box-shadow:0 8px 18px rgba(114,84,230,.22);font-size:10px;opacity:0;pointer-events:none;transform:translateY(-50%) scale(.98);transition:opacity .14s,transform .14s; }
    body.dragging .major-gap.drop-target::after,body.dragging .new-group-zone.drop-target::after { opacity:1;transform:translateY(-50%) scale(1); }
    body.dragging { user-select:none; }
    body.dragging .drag-root-zone { display:block; }
    [data-step-handle] { touch-action:pan-y; }
    body.editing [data-step-handle] { touch-action:none;cursor:grab; }
    body.dragging [data-step-handle] { cursor:grabbing; }
    .major.drag-source,.child.drag-source { opacity:.34; }
    .major.drop-target,.child.drop-target,.drag-root-zone.drop-target { outline:2px solid var(--purple);outline-offset:2px;background:var(--purple-soft); }
    .major.drop-before { box-shadow:inset 0 4px 0 var(--purple); }
    .major.drop-after { box-shadow:inset 0 -4px 0 var(--purple); }
    .drag-ghost { position:fixed;z-index:9999;max-width:230px;padding:8px 11px;border-radius:10px;color:#fff;background:#6241d5;box-shadow:0 12px 30px rgba(44,30,100,.35);font-size:11px;font-weight:700;pointer-events:none;transform:translate(12px,12px); }
    .major { position:relative;border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden; }
    .major::before { content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grey); }
    .major.done::before { background:var(--green); }.major.active::before { background:var(--orange); }.major.blocked::before { background:var(--red); }
    .major-head { width:100%;display:grid;grid-template-columns:31px 1fr auto auto;align-items:start;gap:8px;padding:12px 12px 10px 14px; }
    .major-toggle { min-width:0;padding:0;border:0;background:transparent;text-align:left; }
    .major-index { width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:var(--purple-soft);color:var(--purple);font-weight:760;font-size:12px; }
    .major-name { display:block;font-weight:700; }
    .major-summary { display:block;margin-top:2px;color:var(--muted);font-size:11px; }
    .status { padding:3px 7px;border:0;border-radius:999px;background:rgba(128,128,128,.1);color:var(--muted);font-size:10px;white-space:nowrap; }
    .done .status { color:var(--green);background:rgba(31,157,104,.11); }.active .status { color:var(--orange);background:rgba(232,137,50,.12); }.blocked .status { color:var(--red);background:rgba(217,75,85,.12); }
    .children { position:relative;margin:0 12px 12px 27px;padding-left:18px;border-left:2px solid var(--line); }
    .child { position:relative;padding:7px 0 8px; }
    .child::before { content:"";position:absolute;left:-23px;top:15px;width:9px;height:9px;border:3px solid var(--panel);border-radius:50%;background:var(--grey);box-shadow:0 0 0 1px var(--line); }
    .child.done::before { background:var(--green); }.child.active::before { background:var(--orange); }.child.blocked::before { background:var(--red); }
    .child-head { display:flex;align-items:center;gap:7px; }
    .child-toggle { flex:1;min-width:0;padding:0;border:0;background:transparent;text-align:left; }
    .child-title { flex:1;font-size:12px;font-weight:650; }
    .child-summary { margin:3px 0 0;color:var(--muted);font-size:11px; }
    .notes { display:flex;flex-wrap:wrap;gap:5px;margin-top:6px; }
    .note { padding:3px 7px;border:1px solid rgba(232,137,50,.25);border-radius:7px;background:rgba(232,137,50,.08);color:#a45f22;font-size:10px; }
    @media (prefers-color-scheme:dark){ .note{color:#f1aa69;} }
    .major-notes { padding:0 12px 11px 54px; }
    .related-files { display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px; }
    .major-files { padding:0 12px 11px 54px;margin-top:0; }
    .related-files-label { color:var(--muted);font-size:9px; }
    .file-chip { max-width:100%;display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid rgba(114,84,230,.24);border-radius:8px;color:var(--purple);background:var(--purple-soft);font-size:10px; }
    .file-chip.unavailable { color:var(--muted);border-color:var(--line);background:rgba(128,128,128,.07); }
    .file-chip-name { max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .file-remove { padding:0 2px;border:0;background:transparent;color:var(--muted);font-size:13px;line-height:1; }
    .file-add { padding:3px 6px;border:1px dashed var(--line);border-radius:7px;background:transparent;color:var(--muted);font-size:9px; }
    .fold { color:var(--muted);font-size:13px; }
    .edit-action { padding:3px 7px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--purple);font-size:10px; }
    .edit-mode-on { color:var(--green); }
    .virtual-badge { padding:2px 5px;border-radius:6px;background:var(--purple-soft);color:var(--purple);font-size:9px;white-space:nowrap; }
    .step-actions { display:flex;align-items:center;gap:5px; }
    .conversation-action { padding:3px 7px;border:1px solid rgba(114,84,230,.25);border-radius:7px;background:var(--purple-soft);color:var(--purple);font-size:10px; }
    .empty { padding:25px 12px;text-align:center;color:var(--muted); }
    .issue { padding:11px 12px;border:1px solid rgba(217,75,85,.24);border-radius:13px;background:rgba(217,75,85,.07); }
    .issue + .issue { margin-top:7px; }
    .issue-top,.artifact-top { display:flex;align-items:center;gap:8px; }
    .issue-icon { width:23px;height:23px;display:grid;place-items:center;border-radius:7px;color:var(--red);background:rgba(217,75,85,.12);font-weight:800; }
    .issue-title,.artifact-name { flex:1;font-weight:670;font-size:12px; }
    .issue p,.artifact-meta { margin:5px 0 0;color:var(--muted);font-size:11px; }
    .outline-button { padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--purple);font-size:10px; }
    .artifacts { display:grid;gap:7px; }
    .artifact { padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--panel); }
    .artifact-role { padding:2px 6px;border-radius:6px;background:var(--purple-soft);color:var(--purple);font-size:9px; }
    .artifact-role.output { color:var(--green);background:rgba(31,157,104,.11); }
    .rules { margin:7px 0 0;padding-left:17px;color:var(--muted);font-size:10px; }
    .actions { display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:18px; }
    .primary,.secondary { padding:10px 13px;border-radius:12px; }
    .primary { border:0;color:#fff;background:linear-gradient(145deg,#795de8,#6241d5);box-shadow:0 8px 18px rgba(114,84,230,.2); }
    .secondary { border:1px solid var(--line);background:var(--panel); }
    .footer { display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:10px; }
    .footer button { padding:0;border:0;background:transparent;color:inherit; }
    dialog { width:min(360px,calc(100% - 26px));padding:0;border:1px solid var(--line);border-radius:16px;color:var(--text);background:var(--panel);box-shadow:0 25px 70px rgba(0,0,0,.28); }
    dialog::backdrop { background:rgba(20,18,28,.38);backdrop-filter:blur(2px); }
    .dialog-body { padding:16px; }
    .dialog-body h2 { margin:0 0 4px;font-size:16px; }.dialog-body>p { margin:0 0 13px;color:var(--muted);font-size:11px; }
    .field { display:grid;gap:5px;margin:10px 0;color:var(--muted);font-size:11px; }
    .field select,.field input,.field textarea { width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;color:var(--text);background:var(--bg); }
    .field textarea { min-height:66px;resize:vertical; }
    .danger { margin-right:auto;color:var(--red);border-color:rgba(217,75,85,.35); }
    .dialog-actions { display:flex;justify-content:flex-end;gap:8px;margin-top:15px; }
    .lineage-box { margin-top:10px;padding:10px;border-radius:11px;background:var(--purple-soft);font-size:11px; }
    .lineage-box strong { display:block;margin-bottom:3px; }.lineage-box ul { margin:6px 0 0;padding-left:18px;color:var(--muted); }
    .conversation-quotes { display:grid;gap:9px;margin-top:12px; }
    .quote { max-width:92%;padding:9px 10px;border-radius:11px;background:rgba(128,128,128,.1);font-size:11px; }
    .quote.assistant { margin-left:auto;background:var(--purple-soft); }
    .quote-label { display:block;margin-bottom:3px;color:var(--muted);font-size:10px; }
    .toast { position:fixed;left:15px;right:15px;bottom:15px;padding:10px 12px;border-radius:11px;color:#fff;background:rgba(25,25,24,.92);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;box-shadow:var(--shadow); }
    .toast.show { opacity:1;transform:translateY(0); }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="9" cy="18" r="2"/><path d="M7.8 7.1l8.3-.1M7.1 7.8l1.2 8.3M16.7 8.7l-6.3 7.8"/></svg></div>
      <div class="title-wrap"><h1>流程记忆</h1><div class="subtitle" id="project">正在读取当前对话…</div></div>
      <button class="icon-button" id="close" title="关闭面板" aria-label="关闭面板">×</button>
    </header>
    <label class="conversation-picker" id="conversation-picker"><span>演示对话</span><select id="conversation-select"></select></label>
    <section class="overview">
      <div class="overview-top">
        <div><div class="eyebrow">已确认完成（由步骤状态计算）</div><div class="progress-value"><span id="done-ratio">0 / 0</span> <small>步</small></div></div>
        <div class="recording" id="recording" role="switch" aria-checked="false" tabindex="0"><span id="record-label">记录已暂停</span><i class="switch"></i></div>
      </div>
      <div class="bar"><i id="progress"></i></div>
      <div class="counts"><span><b id="major-count">0</b> 个主步骤</span><span><b id="active-count">0</b> 进行中</span><span><b id="remaining-count">0</b> 待处理</span></div>
    </section>
    <div class="section-title"><span class="section-label"><strong>步骤图谱</strong><span class="drag-tip" id="drag-tip">整理视图只改变展示，原始流程不会被拖动</span></span><div class="section-actions"><div class="view-toggle" aria-label="顺序视图"><button data-order-view="original">原始</button><button class="active" data-order-view="organized">整理</button></div><div class="view-toggle" aria-label="显示层级"><button data-level="1" title="显示1级">1</button><button data-level="2" title="显示2级">2</button><button class="active" data-level="3" title="显示3级">3</button></div><button class="text-button" id="undo" title="撤销上次修改" hidden>↶0</button><button class="text-button" id="restore-layout" title="恢复原始顺序">复原</button><button class="text-button" id="edit-mode" title="调整整理视图">调序</button><button class="text-button" id="add" title="记录一个步骤">＋步</button></div></div>
    <div class="drag-root-zone" id="drag-root-zone" data-drop-root="true">二级步骤拖到空白处：自动新建一级分组</div>
    <section class="flow" id="flow"><div class="empty">加载中…</div></section>
    <section id="issues-section" hidden><div class="section-title"><strong>当前异常</strong><span class="eyebrow">可沿输入文件回溯</span></div><div id="issues"></div></section>
    <section><div class="section-title"><strong>输入与产出</strong><button class="text-button" id="link-project">＋ 关联项目</button></div><div class="artifacts" id="artifacts"></div></section>
    <div class="actions"><button class="primary" id="organize">让 AI 整理流程</button><button class="secondary" id="close-bottom">关闭</button></div>
    <div class="footer"><span id="updated">尚未同步</span><button id="reset">恢复当前演示数据</button></div>
  </main>
  <dialog id="link-dialog"><form class="dialog-body" method="dialog"><h2>关联其他项目的产出</h2><p>只有你点击确认后才会关联。插件不会自动把两个项目合并。</p><label class="field">来源项目<select id="source-project"></select></label><label class="field">作为输入的文件<select id="source-artifact"></select></label><div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button class="primary" id="confirm-link" value="default">确认关联</button></div></form></dialog>
  <dialog id="edit-dialog"><form class="dialog-body" method="dialog"><h2>调整流程步骤</h2><p>可以改名、修改说明和注意事项，也可以把步骤改为主步骤或归到另一个主步骤下面。</p><label class="field">步骤名称<input id="edit-title" maxlength="120" /></label><label class="field">步骤说明<textarea id="edit-summary" maxlength="500"></textarea></label><label class="field">所在层级<select id="edit-parent"></select></label><label class="field">注意事项（每行一条）<textarea id="edit-notes" maxlength="1600"></textarea></label><div class="dialog-actions"><button class="secondary danger" id="delete-step" type="button">删除这一步</button><button class="secondary" value="cancel">取消</button><button class="primary" id="save-step" value="default">保存调整</button></div></form></dialog>
  <dialog id="conversation-dialog"><div class="dialog-body"><h2 id="conversation-title">对话依据</h2><p>这是建立该步骤时保存的相关对话摘录。当前宿主暂不支持跳到原消息位置。</p><div class="conversation-quotes" id="conversation-quotes"></div><div class="dialog-actions"><button class="secondary" id="close-conversation">关闭</button><button class="primary" id="ask-ai-conversation">从这一步继续</button></div></div></dialog>
  <dialog id="lineage-dialog"><div class="dialog-body"><h2>来源回溯</h2><p>这里展示来源项目保存的步骤和规则，不复制整段旧对话。</p><div id="lineage-content"></div><div class="dialog-actions"><button class="secondary" id="close-lineage">关闭</button><button class="primary" id="ask-ai-source">交给当前 AI 检查</button></div></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const labels={done:"已完成",active:"进行中",pending:"待处理",blocked:"受阻"};
    const nextStatus={pending:"active",active:"done",done:"pending",blocked:"active"};
    const demoOrder=["project-a","project-b","project-c","memory-graph","utility-bills"];
    let state=null,detailLevel=3,orderView="organized",expanded="",catalog=[],currentLineage=null,currentConversationStep=null,editingId=null,editMode=false,dragGesture=null,htmlDragId=null,htmlDragPosition="onto",suppressStepClickUntil=0;
    const collapsedMajors=new Set(),expandedNotes=new Set();
    let localSession=new URLSearchParams(location.search).get("conversation")||"memory-graph";
    const $=(s)=>document.querySelector(s),host=()=>window.openai,isHosted=()=>Boolean(host()?.callTool);
    const escapeHtml=(v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const graphSteps=()=>orderView==="organized"?(state.displaySteps||state.steps):state.steps;
    function localUrl(url){if(isHosted()||!url.startsWith("/api/"))return url;const s=url.includes("?")?"&":"?";return `${url}${s}session=${encodeURIComponent(localSession)}`;}
    function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),2400);}
    function resultState(result){return result?.structuredContent?.state||result?._meta?.state||result?.state||null;}
    function resultProjects(result){return result?.structuredContent?.projects||result?.projects||[];}
    function resultLineage(result){return result?.structuredContent?.lineage||result?.lineage||null;}
    async function call(name,args={},localRequest){if(isHosted())return host().callTool(name,args);const [url,options={}]=localRequest;const response=await fetch(localUrl(url),{headers:{"content-type":"application/json"},...options});const body=await response.json();if(!response.ok)throw new Error(body.error||`请求失败：${response.status}`);return body;}

    function renderFlow(){const steps=graphSteps(),parentIds=new Set(steps.map(s=>s.id));let majors=steps.filter(s=>!s.parentId||!parentIds.has(s.parentId));if(!majors.length)majors=steps;const cards=majors.map((major,index)=>{const children=steps.filter(s=>s.parentId===major.id);const open=(detailLevel>=2&&!collapsedMajors.has(major.id))||expanded===major.id;const showMajorNotes=(detailLevel>=3||expandedNotes.has(major.id))&&open;const status=major.virtual?`<span class="virtual-badge">自动分组</span>`:`<button class="status" data-status="${escapeHtml(major.id)}">${labels[major.status]||major.status}</button>`;const edit=editMode?(major.virtual?`<button class="edit-action" data-rename-group="${escapeHtml(major.id)}">改名</button>`:`<button class="edit-action" data-edit="${escapeHtml(major.id)}">调整</button>`):"";return `<article class="major ${escapeHtml(major.status)}" data-drop-step="${escapeHtml(major.id)}"><div class="major-head"><span class="major-index">${index+1}</span><button class="major-toggle" draggable="false" data-step-handle="${escapeHtml(major.id)}" data-expand="${escapeHtml(major.id)}" title="点击展开次级步骤；长按拖动"><span class="major-name">${escapeHtml(major.title)} <span class="fold">${children.length?open?"▾":"▸":""}</span></span><span class="major-summary">${escapeHtml(major.summary||"暂无说明")}</span></button>${status}<span class="step-actions">${conversationButton(major)}${edit}</span></div>${showMajorNotes&&major.notes?.length?`<div class="major-notes notes">${major.notes.map(n=>`<span class="note">注意：${escapeHtml(n)}</span>`).join("")}</div>`:""}${showMajorNotes?relatedFilesMarkup(major.id,true):""}${open&&children.length?`<div class="children">${children.map(childMarkup).join("")}</div>`:""}</article>`;});if(!cards.length){$("#flow").innerHTML='<div class="empty">还没有流程步骤</div>';return;}const content=[];cards.forEach((card,index)=>{content.push(`<div class="major-gap" data-drop-root="true" data-before-major="${escapeHtml(majors[index].id)}" data-drop-label="松开：     async function groupDraggedStep(stepId,placement={}){const before=graphSteps().find(item=>item.id===stepId);if(!before?.parentId){if(placement.beforeId)return moveDraggedStep(stepId,placement.beforeId,"before");if(placement.afterId)return moveDraggedStep(stepId,placement.afterId,"after");return moveDraggedStep(stepId,null);}try{const input={id:stepId,...placement};const result=await call("group_flow_step",input,[`/api/steps/${encodeURIComponent(stepId)}/group`,{method:"POST",body:JSON.stringify(input)}]);state=resultState(result)||state;const child=(state.displaySteps||[]).find(item=>item.id===stepId),group=(state.displaySteps||[]).find(item=>item.id===child?.parentId);if(group)collapsedMajors.delete(group.id);render();toast(group?`已在放下的位置新建“${group.title}”`:"已新建一级分组");if(group&&host()?.sendFollowUpMessage){host().sendFollowUpMessage({prompt:`请为整理视图中新建的主步骤分组起一个不超过10个汉字的准确名称。它当前叫“${group.title}”，包含次级步骤“${before.title}”。请只调用 rename_flow_group，参数 id 为“${group.id}”，title 为你拟定的名称；不要修改原始流程或步骤层级。`,scrollToBottom:false}).catch(()=>toast("已使用本地名称；稍后可点“改名”调整"));}}catch(e){toast(e.message||"暂时无法新建分组");}}

    function dragPlan(step,target,position="onto"){const steps=graphSteps();if(!target)return {parentId:null,afterId:null,beforeId:null,message:"已设为主步骤并移到末尾"};if(!step.parentId){if(target.parentId===step.id)return null;const targetMajor=target.parentId?steps.find(item=>item.id===target.parentId):target;if(position==="before"&&!target.parentId)return {parentId:null,afterId:null,beforeId:target.id,message:`已移动到“${target.title}”之前`};return {parentId:null,afterId:targetMajor.id,beforeId:null,message:`已移动到“${targetMajor.title}”之后`};}if(target.parentId)return {parentId:target.parentId,afterId:target.id,beforeId:null,message:`已移动到“${target.title}”之后`};return {parentId:target.id,afterId:target.id,beforeId:null,message:`已归入“${target.title}”`};}

    function moveStepPress(event){if(!dragGesture)return;dragGesture.x=event.clientX;dragGesture.y=event.clientY;if(!dragGesture.active){if(Math.hypot(event.clientX-dragGesture.startX,event.clientY-dragGesture.startY)<=9)return;clearTimeout(dragGesture.timer);activateDragGesture();}if(dragGesture?.active){event.preventDefault();updateDragTarget(event.clientX,event.clientY);}}
    async function endStepPress(event){if(!dragGesture)return;clearTimeout(dragGesture.timer);releaseDragPointer();if(!dragGesture.active){dragGesture=null;return;}event.preventDefault();const {stepId,targetId,toRoot,beforeId,afterId,position}=dragGesture;suppressStepClickUntil=Date.now()+600;clearDragVisuals();dragGesture=null;if(toRoot)await groupDraggedStep(stepId,{beforeId,afterId});else if(targetId)await moveDraggedStep(stepId,targetId,position);else toast("请放到紫色提示区或某个步骤上");}
    function beginHtmlDrag(event){const handle=event.target.closest("[data-step-handle]");if(!editMode||!handle)return;cancelDragGesture();htmlDragId=handle.dataset.stepHandle;event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",htmlDragId);document.body.classList.add("dragging");handle.closest("[data-drop-step]")?.classList.add("drag-source");}
    function overHtmlDrop(event){if(!htmlDragId)return;const root=event.target.closest("[data-drop-root]");let card=event.target.closest("[data-drop-step]");if(card?.closest(".drag-source"))card=null;if(!root&&!card)return;event.preventDefault();event.dataTransfer.dropEffect="move";document.querySelectorAll(".drop-target,.drop-before,.drop-after").forEach(item=>item.classList.remove("drop-target","drop-before","drop-after"));const steps=graphSteps(),dragged=steps.find(item=>item.id===htmlDragId),target=card?steps.find(item=>item.id===card.dataset.dropStep):null;htmlDragPosition="onto";if(dragged&&!dragged.parentId&&target&&!target.parentId){const rect=card.getBoundingClientRect();htmlDragPosition=event.clientY<rect.top+rect.height/2?"before":"after";card.classList.add(htmlDragPosition==="before"?"drop-before":"drop-after");}else{(root||card).classList.add("drop-target");}}
    async function finishHtmlDrop(event){if(!htmlDragId)return;const root=event.target.closest("[data-drop-root]");let card=event.target.closest("[data-drop-step]");if(card?.closest(".drag-source"))card=null;if(!root&&!card)return;event.preventDefault();const stepId=htmlDragId,targetId=card?.dataset.dropStep||null,position=htmlDragPosition,placement={beforeId:root?.dataset.beforeMajor||null,afterId:root?.dataset.afterMajor||null};suppressStepClickUntil=Date.now()+600;htmlDragId=null;htmlDragPosition="onto";clearDragVisuals();if(root)await groupDraggedStep(stepId,placement);else await moveDraggedStep(stepId,targetId,position);}
    function endHtmlDrag(){htmlDragId=null;htmlDragPosition="onto";clearDragVisuals();}
    async function traceSource(artifactId){try{const result=await call("trace_artifact_source",{artifactId},[`/api/lineage?artifactId=${encodeURIComponent(artifactId)}`]);currentLineage=resultLineage(result);const l=currentLineage;$("#lineage-content").innerHTML=`<div class="lineage-box"><strong>${escapeHtml(l.sourceProject.title)} → ${escapeHtml(l.sourceArtifact.name)}</strong><div>${escapeHtml(l.sourceArtifact.format||"")}</div><ul>${(l.sourceRules||[]).map(r=>`<li>${escapeHtml(r)}</li>`).join("")}</ul></div><div class="lineage-box"><strong>来源项目关键步骤</strong><ul>${(l.sourceSteps||[]).map(s=>`<li>${escapeHtml(s.title)}：${escapeHtml(s.summary)}</li>`).join("")}</ul></div>`;$("#lineage-dialog").showModal();}catch(e){toast(e.message);}}
    async function askAiSource(){if(!currentLineage)return;const l=currentLineage;const prompt=`当前项目发现输入文件异常。请参考来源项目“${l.sourceProject.title}”的产出“${l.sourceArtifact.name}”。已记录规则：${(l.sourceRules||[]).join("；")}。来源步骤：${(l.sourceSteps||[]).map(s=>s.title).join(" → ")}。请判断异常最可能产生在哪一步，并给出核查顺序；不要假装已经检查过文件。`;if(host()?.sendFollowUpMessage){await host().sendFollowUpMessage({prompt});toast("已把来源摘要交给当前 AI");}else{await navigator.clipboard?.writeText(prompt).catch(()=>{});toast("本地预览：来源摘要已复制");}$("#lineage-dialog").close();}
    async function organize(){const prompt="请把当前工作整理成分层流程：先列主步骤，再列每个主步骤的次级步骤和注意事项；同时记录输入、产出、格式规则和异常。不要编造未确认的进度。";if(host()?.sendFollowUpMessage){await host().sendFollowUpMessage({prompt});toast("已请 AI 整理分层流程");}else{await navigator.clipboard?.writeText(prompt).catch(()=>{});toast("本地预览：整理指令已复制");}}
    async function closePanel(){if(host()?.requestClose)await host().requestClose();else toast("接入宿主后，这里会关闭右侧面板");}
    async function resetDemo(){if(!confirm("恢复这个对话的演示数据？"))return;try{const result=await call("reset_flow_demo",{},["/api/reset",{method:"POST",body:"{}"}]);state=resultState(result)||state;expanded="";collapsedMajors.clear();expandedNotes.clear();render();toast("演示数据已恢复");}catch(e){toast(e.message);}}
    document.addEventListener("pointerdown",beginStepPress);document.addEventListener("pointermove",moveStepPress,{passive:false});document.addEventListener("pointerup",endStepPress);document.addEventListener("pointercancel",cancelDragGesture);
    document.addEventListener("mousedown",event=>{if(!dragGesture)beginStepPress(event);});document.addEventListener("mousemove",moveStepPress,{passive:false});document.addEventListener("mouseup",endStepPress);
    document.addEventListener("dragstart",beginHtmlDrag);document.addEventListener("dragover",overHtmlDrop);document.addEventListener("drop",finishHtmlDrop);document.addEventListener("dragend",endHtmlDrag);
    document.addEventListener("click",event=>{if(Date.now()<suppressStepClickUntil&&event.target.closest("[data-step-handle]")){event.preventDefault();event.stopPropagation();return;}const openFile=event.target.closest("[data-open-file]");if(openFile){event.preventDefault();event.stopPropagation();openRelatedFile(openFile.dataset.openFile);return;}const addFile=event.target.closest("[data-add-file]");if(addFile){event.preventDefault();event.stopPropagation();addRelatedFile(addFile.dataset.addFile);return;}const removeFile=event.target.closest("[data-remove-file]");if(removeFile){event.preventDefault();event.stopPropagation();removeRelatedFile(removeFile.dataset.removeFile);return;}const trace=event.target.closest("[data-trace]");if(trace){traceSource(trace.dataset.trace);return;}const conversation=event.target.closest("[data-conversation]");if(conversation){event.preventDefault();event.stopPropagation();openConversation(conversation.dataset.conversation);return;}const rename=event.target.closest("[data-rename-group]");if(rename){event.preventDefault();event.stopPropagation();renameGroup(rename.dataset.renameGroup);return;}const edit=event.target.closest("[data-edit]");if(edit){event.preventDefault();event.stopPropagation();openStepEditor(edit.dataset.edit);return;}const status=event.target.closest("[data-status]");if(status){event.preventDefault();event.stopPropagation();changeStatus(status.dataset.status);return;}const note=event.target.closest("[data-note-toggle]");if(note){const id=note.dataset.noteToggle;expandedNotes.has(id)?expandedNotes.delete(id):expandedNotes.add(id);render();return;}const card=event.target.closest("[data-expand]");if(card){const id=card.dataset.expand;if(detailLevel===1){expanded=expanded===id?"":id;}else{collapsedMajors.has(id)?collapsedMajors.delete(id):collapsedMajors.add(id);}render();return;}const order=event.target.closest("[data-order-view]");if(order){orderView=order.dataset.orderView;editMode=false;expanded="";collapsedMajors.clear();render();return;}const level=event.target.closest("[data-level]");if(level){detailLevel=Number(level.dataset.level);expanded="";collapsedMajors.clear();document.querySelectorAll("[data-level]").forEach(x=>x.classList.toggle("active",x===level));render();}});
    $("#recording").addEventListener("click",toggleRecording);$("#recording").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")toggleRecording();});$("#add").addEventListener("click",addStep);$("#undo").addEventListener("click",undoLastChange);$("#restore-layout").addEventListener("click",restoreOriginalLayout);$("#edit-mode").addEventListener("click",()=>{editMode=!editMode;render();});$("#save-step").addEventListener("click",saveStepEdit);$("#delete-step").addEventListener("click",deleteEditingStep);$("#close-conversation").addEventListener("click",()=>$("#conversation-dialog").close());$("#ask-ai-conversation").addEventListener("click",askAiConversation);$("#organize").addEventListener("click",organize);$("#link-project").addEventListener("click",openLinkDialog);$("#source-project").addEventListener("change",updateArtifactOptions);$("#confirm-link").addEventListener("click",confirmLink);$("#close-lineage").addEventListener("click",()=>$("#lineage-dialog").close());$("#ask-ai-source").addEventListener("click",askAiSource);$("#close").addEventListener("click",closePanel);$("#close-bottom").addEventListener("click",closePanel);$("#reset").addEventListener("click",resetDemo);
    $("#conversation-select").addEventListener("change",event=>{localSession=event.target.value;history.replaceState(null,"",`${location.pathname}?conversation=${encodeURIComponent(localSession)}`);state=null;expanded="";collapsedMajors.clear();expandedNotes.clear();$("#flow").innerHTML='<div class="empty">正在切换对话…</div>';load();});
    window.addEventListener("openai:set_globals",event=>{const globals=event.detail?.globals||event.detail;const incoming=globals?.toolOutput?.state||globals?.toolResponseMetadata?.state;if(incoming){state=incoming;render();}});
    loadLocalSessions();load();setInterval(()=>{if(!document.hidden)load(true);},5000);
  </script>
